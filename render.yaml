services:
  - type: web
    name: voiceup-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOCAL_AUTH_BYPASS
        value: "false"
      - key: PORT
        value: "8080"
