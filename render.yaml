services:
  - type: web
    name: voiceup-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOCAL_AUTH_BYPASS
        value: "true"
      - key: LOCAL_USER_EMAIL
        value: local@voiceup.dev
      - key: LOCAL_ROLE
        value: student
      - key: PORT
        value: "8080"
